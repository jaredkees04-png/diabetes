name: dose_glucose_log
description: "Dose & Glucose Log — a personal, on-device diabetes management tool."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local, on-device storage only — no cloud sync.
  sqflite: ^2.4.1
  path: ^1.9.1
  shared_preferences: ^2.3.4

  # Formatting dates/numbers
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
